[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanchat"
version = "0.2.0"
description = "LeanChat - schlanker Chat fuer OpenAI-kompatible Endpunkte (FastAPI-Backend, verschluesselte per-user SQLite-Dateien)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",  # API-Models (app/models.py) + AppConfig-Validierung (app/config.py)
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # Multipart-Uploads (POST /api/sessions/{id}/attachments)
    "cryptography>=42",
    # user_registry (Login/Registrierung) und trixie_ai (LlmContext fuer die Chat-History)
    # werden als vendored Wheels installiert:
    #   pip install ./vendors/user_registry-0.1.0-py3-none-any.whl ./vendors/trixie_ai-0.1.0-py3-none-any.whl
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "playwright>=1.45",
    "ruff>=0.8",
    "mypy>=1.11",  # Typecheck: python -m mypy (Konfig unten, CI-Job typecheck)
]

[tool.setuptools]
packages = ["app", "app.db", "app.routers", "app.services"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# Konservatives Regel-Set, das der bestehende Codebestand einhaelt (CI-Lint-Job).
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# app/ ist vollstaendig typisiert (CI-Job typecheck: python -m mypy).
files = ["app", "scripts", "main.py"]
python_version = "3.11"
strict = true
warn_unused_ignores = true
pretty = true

[[tool.mypy.overrides]]
# vendored Wheels ohne py.typed-Marker
module = ["user_registry.*", "trixie_ai.*", "voice_companion.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: GUI-Tests mit Playwright (User Journey), brauchen Chromium",
]
