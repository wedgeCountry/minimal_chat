[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanchat"
version = "0.2.0"
description = "LeanChat - schlanker Chat fuer OpenAI-kompatible Endpunkte (FastAPI-Backend, verschluesselte per-user SQLite-Dateien)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=42",
    "python-multipart>=0.0.9",  # Multipart-Uploads (POST /api/sessions/{id}/attachments)
    # user_registry (Login/Registrierung) wird als vendored Wheel installiert:
    #   pip install ./vendors/user_registry-0.1.0-py3-none-any.whl
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "playwright>=1.45",
]

[tool.setuptools]
packages = ["app", "app.db", "app.routers", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: GUI-Tests mit Playwright (User Journey), brauchen Chromium",
]
