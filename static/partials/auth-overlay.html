<div id="authOverlay">
  <div class="modal authModal">
    <h2>LeanChat</h2>
    <p class="authHint" id="authHint">Anmelden oder registrieren</p>
    <div class="field"><label>Benutzername</label><input id="authUser" autocomplete="username" /></div>
    <div class="field"><label>Passwort</label><input id="authPass" type="password" autocomplete="current-password" /></div>
    <div class="authErr" id="authErr"></div>
    <div class="row">
      <button class="btn" id="authSwitch">Registrieren</button>
      <button class="btn primary" id="authSubmit">Anmelden</button>
    </div>
  </div>
</div>
