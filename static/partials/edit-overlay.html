<div id="editOverlay" class="overlay" data-testid="edit-overlay">
  <div class="modal editModal" data-testid="edit-modal">
    <h2 data-testid="edit-title">Nachricht bearbeiten</h2>
    <textarea id="editInput" class="editInput" data-testid="bubble-edit-input" rows="5"></textarea>
    <div class="row" data-testid="edit-actions">
      <button class="btn" id="editCancelBtn" data-testid="bubble-edit-cancel-btn" type="button">Abbrechen</button>
      <button class="btn primary" id="editSendBtn" data-testid="bubble-edit-send-btn" type="button">Senden</button>
    </div>
  </div>
</div>
