<div id="confirmOverlay" data-testid="confirm-overlay">
  <div class="modal" data-testid="confirm-modal">
    <h2 id="confirmTitle" data-testid="confirm-title">Bestätigen</h2>
    <p class="confirmText" id="confirmText" data-testid="confirm-text"></p>
    <div class="row" data-testid="confirm-actions">
      <button class="btn" id="confirmCancel" data-testid="confirm-cancel">Abbrechen</button>
      <button class="btn primary danger" id="confirmOk" data-testid="confirm-ok">Löschen</button>
    </div>
  </div>
</div>
