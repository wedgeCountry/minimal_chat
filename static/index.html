<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeanChat</title>
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<div id="authOverlay">
  <div class="modal authModal">
    <h2>LeanChat</h2>
    <p class="authHint" id="authHint">Anmelden oder registrieren</p>
    <div class="field"><label>Benutzername</label><input id="authUser" autocomplete="username" /></div>
    <div class="field"><label>Passwort</label><input id="authPass" type="password" autocomplete="current-password" /></div>
    <div class="authErr" id="authErr"></div>
    <div class="row">
      <button class="btn" id="authSwitch">Registrieren</button>
      <button class="btn primary" id="authSubmit">Anmelden</button>
    </div>
  </div>
</div>

<header id="header">
  <button id="panelBtn" title="Side-Panel ein-/ausklappen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>
  <div class="title" id="headerTitle">LeanChat</div>
  <div id="burgerWrap">
    <button id="burgerBtn" title="Menü"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
    <div id="burgerMenu">
      <button id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>Einstellungen</button>
      <div class="sep"></div>
      <button id="logoutBtn"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button>
    </div>
  </div>
</header>

<div id="main">
  <aside id="side">
    <div id="sessions"></div>
    <div id="sideFooter">
      <button id="abortBtnSide" title="Generierung abbrechen"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>Abbrechen</button>
    </div>
  </aside>

  <div id="chatWrap">
    <div id="chat"></div>
    <div id="progress"></div>
    <div id="composerWrap">
      <div id="attachments"></div>
      <div id="composer">
        <button id="attachBtn" title="Datei anhängen"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        <button id="camBtn" title="Foto aufnehmen"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        <button id="micBtn" title="Nachricht einsprechen"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
        <textarea id="input" rows="1" placeholder="Nachricht schreiben…"></textarea>
        <button id="sendBtn" title="Senden"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <div class="hint">Enter sendet · Shift+Enter neue Zeile</div>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="modal">
    <h2>Einstellungen</h2>
    <div class="field"><label>Base-URL</label><input id="setBase" placeholder="https://api.openai.com/v1" /></div>
    <div class="field"><label>API-Schlüssel (serverseitig gespeichert)</label><input id="setKey" type="password" placeholder="sk-… (optional, überschreibt Server-Key)" /></div>
    <div class="field"><label>Modell</label><input id="setModel" placeholder="gpt-4o-mini" /></div>
    <div class="field"><label>Theme</label><select id="setTheme"><option value="light">Hell</option><option value="dark">Dunkel</option></select></div>
    <div class="row">
      <button class="btn" id="setCancel">Abbrechen</button>
      <button class="btn primary" id="setSave">Speichern</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple hidden />
<input type="file" id="camInput" accept="image/*" capture="environment" hidden />

<script type="module" src="/js/main.js"></script>
</body>
</html>
