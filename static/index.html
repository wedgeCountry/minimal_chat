<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeanChat</title>
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/bubbles.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<header id="header">
  <button id="panelBtn" title="Side-Panel ein-/ausklappen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>
  <div class="title" id="headerTitle" data-testid="header-title">LeanChat</div>
  <div id="burgerWrap" data-testid="burger-wrap">
    <button id="burgerBtn" data-testid="burger-btn" title="Menü"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
    <div id="burgerMenu" data-testid="burger-menu">
      <button id="settingsBtn" data-testid="settings-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>Allgemein</button>
      <button id="llmSettingsBtn" data-testid="llm-settings-btn"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/><line x1="12" y1="11" x2="12" y2="16"/></svg>LLM</button>
      <button id="compactBtn" data-testid="compact-btn"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="17" y2="18"/></svg>Kompaktansicht</button>
      <div class="sep" data-testid="burger-sep"></div>
      <button id="changePwBtn" data-testid="change-password-btn" title="Passwort aendern (user_registry)"><svg viewBox="0 0 24 24"><circle cx="7.5" cy="12" r="3.5"/><line x1="11" y1="12" x2="21" y2="12"/><line x1="17" y1="12" x2="17" y2="16"/><line x1="21" y1="12" x2="21" y2="16"/></svg>Passwort &auml;ndern</button>
      <button id="logoutBtn" data-testid="logout-btn"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button>
    </div>
  </div>
</header>

<div id="main" data-testid="main">
  <div id="chatRow" data-testid="chat-row">
    <div data-partial="/partials/side-panel.html"></div>
    <div data-partial="/partials/chat-window.html"></div>
  </div>
  <div id="progress" data-testid="progress"></div>
  <div id="composerWrap" data-testid="composer-wrap">
    <div id="attachments" data-testid="attachments"></div>
    <div id="composer" data-testid="composer">
      <button id="attachBtn" data-testid="attach-btn" title="Datei anhängen"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button id="camBtn" data-testid="cam-btn" title="Foto aufnehmen"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <button id="micBtn" data-testid="mic-btn" title="Nachricht einsprechen"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
      <textarea id="input" data-testid="chat-input" rows="1" placeholder="Nachricht schreiben…"></textarea>
      <button id="sendBtn" data-testid="send-btn" title="Senden"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor" stroke="none"/></svg></button>
    </div>
    <div class="hint" id="composer-hint" data-testid="composer-hint">Enter sendet · Shift+Enter neue Zeile</div>
  </div>
</div>

<div data-partial="/partials/settings-overlay.html"></div>
<div data-partial="/partials/confirm-overlay.html"></div>
<div data-partial="/partials/error-overlay.html"></div>

<input type="file" id="fileInput" data-testid="file-input" multiple hidden />
<input type="file" id="camInput" data-testid="cam-input" accept="image/*" capture="environment" hidden />

<script type="module" src="/js/main.js"></script>
</body>
</html>
